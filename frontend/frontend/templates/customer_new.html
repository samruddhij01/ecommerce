{% extends "base.html" %}
{% block title %}New customer · Stockroom{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>New customer</h1>
  </div>
</div>

<form method="post" class="card">
  <div class="field">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
  </div>
  <div class="btn-row">
    <button type="submit" class="btn btn-accent">Create customer</button>
    <a href="{{ url_for('customers_list') }}" class="btn btn-ghost">Cancel</a>
  </div>
</form>
{% endblock %}
